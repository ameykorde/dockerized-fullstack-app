version: '3.9'

services:

  mongo:
    image: mongo
    container_name: mongo_container
    restart: always

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret

    volumes:
      - mongo_data:/data/db

    networks:
      - app_network


  backend:
    build:
      context: ./backend

    container_name: backend_container
    restart: always

    ports:
      - "8080:8080"

    env_file:
      - ./backend/.env

    depends_on:
      - mongo

    networks:
      - app_network


  frontend:
    build:
      context: ./frontend

    container_name: frontend_container
    restart: always

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - app_network


volumes:
  mongo_data:


networks:
  app_network:
